events {}

http {
    upstream client {
        server frontend:80;
    }

    upstream backend {
        server api:8080;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name stckpt.com www.stckpt.com;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://stckpt.com$request_uri;
        }
    }

