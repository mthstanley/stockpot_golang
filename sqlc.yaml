version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: bigint_nullable
            go_type:
              type: "pgtype.Numeric"
